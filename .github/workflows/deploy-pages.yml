name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Publish Blazor app
        run: dotnet publish LittleLamb/LittleLamb.csproj --configuration Release --output publish
      - name: Prepare Pages hosting
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Project URLs use /LittleLambs/; a custom domain serves at /.
          base_path="${PAGES_BASE_PATH%/}/"
          case "$base_path" in
            /|/LittleLambs/) ;;
            *) echo "Unexpected Pages base path: $base_path" >&2; exit 1 ;;
          esac
          grep -Fq '<base href="/" />' publish/wwwroot/index.html
          sed -i "s|<base href=\"/\" />|<base href=\"$base_path\" />|" publish/wwwroot/index.html
          # Blazor Routing: Load the app for direct visits and refreshes of client routes.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
