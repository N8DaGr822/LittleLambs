name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/configure-pages@v5
      - name: Publish Blazor app
        run: dotnet publish LittleLamb/LittleLamb.csproj --configuration Release --output publish
      - name: Prepare Pages hosting
        run: |
          # Pages Hosting: Keep local development at / and deploy under the repository path.
          sed -i 's|<base href="/" />|<base href="/LittleLambs/" />|' publish/wwwroot/index.html
          # Blazor Routing: Load the app for direct visits and refreshes of client routes.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
